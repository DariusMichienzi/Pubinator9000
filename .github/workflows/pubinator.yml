# Builds the Pubinator site and publishes it to GitHub Pages.
#
# Runs: just after midnight London time (new day, new password), after every
# lock-in and every form response (the gatekeeper asks for a rebuild),
# whenever you push a change, and when you press "Run workflow" on the
# Actions tab.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   MASTER_PASSWORD    same as in the Apps Script properties
#   LOCKIN_URL         the Apps Script web app URL (ends in /exec)
#   RESPONSES_CSV_URL  optional backup: "Publish to web" CSV link for the
#                      responses tab, used only if the gatekeeper can't serve them
 
name: Pubinator
 
on:
  schedule:
    - cron: "5 23 * * *"   # 00:05 London in summer (BST)
    - cron: "5 0 * * *"    # 00:05 London in winter (GMT)
  repository_dispatch:
    types: [pubinator-lockin, pubinator-response]
  push:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: pubinator-pages
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
 
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
 
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Download responses and history
        env:
          RESPONSES_CSV_URL: ${{ secrets.RESPONSES_CSV_URL }}
          LOCKIN_URL: ${{ secrets.LOCKIN_URL }}
        run: |
          # strip spaces, line breaks and quote marks picked up when pasting the secrets
          clean() { printf '%s' "$1" | tr -d "[:space:]\"'"; }
          RESP=$(clean "$RESPONSES_CSV_URL")
          LOCK=$(clean "$LOCKIN_URL")
          check() {
            case "$2" in
              "") echo "::error::The $1 secret is empty or missing."; exit 1 ;;
              https://*) ;;
              *) echo "::error::The $1 secret doesn't start with https:// (check what was pasted)."; exit 1 ;;
            esac
          }
          check LOCKIN_URL "$LOCK"
          case "$LOCK" in */exec) ;; *) echo "::warning::LOCKIN_URL doesn't end in /exec.";; esac
          # a CSV, not a web page or the gatekeeper's JSON status message
          is_csv() { [ -s "$1" ] && ! head -c 300 "$1" | grep -qiE '<html|^[[:space:]]*\{'; }
          # responses: fresh from the gatekeeper, else the published link as a backup
          if curl -fsSL "$LOCK?responses=csv" -o responses.csv && is_csv responses.csv; then
            echo "Responses read from the gatekeeper."
          elif [ -n "$RESP" ]; then
            echo "::warning::Gatekeeper didn't serve the responses (is the latest pubinator.gs deployed as a new version?). Using RESPONSES_CSV_URL instead."
            curl -fsSL "$RESP" -o responses.csv || { echo "::error::Couldn't download the responses (RESPONSES_CSV_URL)."; exit 1; }
            is_csv responses.csv || { echo "::error::RESPONSES_CSV_URL returned a web page, not a CSV. Use the 'Publish to web' link with CSV selected."; exit 1; }
          else
            echo "::error::Couldn't get the responses from the gatekeeper and there's no RESPONSES_CSV_URL backup."; exit 1
          fi
          curl -fsSL "$LOCK?history=csv" -o history.csv || { echo "::error::Couldn't download the history (LOCKIN_URL)."; exit 1; }
          head -1 history.csv | grep -q '^date,pub' || { echo "::error::LOCKIN_URL?history=csv didn't return the history. Is the new pubinator.gs deployed as a new version?"; exit 1; }
          echo "LOCKIN_URL=$LOCK" >> "$GITHUB_ENV"
          echo "Responses: $(($(wc -l < responses.csv) - 1)) rows"
          echo "History:"; cat history.csv
 
      - name: Build page
        run: julia pubinator.jl responses.csv --pubs pubs.txt --history history.csv --site site --lockin-url "$LOCKIN_URL"
 
      - name: Lock the order with today's password
        env:
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
        run: |
          node encrypt.mjs site
          test ! -e site/order.json
 
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
 
